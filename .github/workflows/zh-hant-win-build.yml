name: zh-Hant Windows Test Build

# Fork-only test build: unsigned x64 NSIS installer uploaded as a workflow
# artifact. Never publishes a release and needs no secrets.
on:
  push:
    branches: [ci/zh-hant-win-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win:
    # Same image as the upstream Windows legs; windows-latest breaks node-gyp.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build Windows process-table addon for the relay
        shell: bash
        run: node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64

      - name: Build app
        shell: bash
        run: pnpm build:release

      - name: Package unsigned x64 installer
        shell: bash
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win nsis:x64 --publish never
        env:
          ORCA_BUILD_COMMIT: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: orca-zh-hant-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
